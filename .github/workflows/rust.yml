#
# rust-ci.yml — Cargo build, test, clippy, and fmt for paint-type.
# paint-type's Cargo.toml lives at src/paint_core/Cargo.toml; the workflow
# builds libpt (Zig static library) first so cargo can link it, then
# runs check / fmt / clippy / test against the paint_core crate.
name: Rust CI
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  check:
    name: Cargo check + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          components: clippy, rustfmt
      - name: Install Zig 0.15
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v1
        with:
          version: 0.15.1
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/paint_core
      - name: Build libpt (Zig static library)
        run: |
          cd src/interface/ffi
          zig build
      - name: Cargo check
        working-directory: src/paint_core
        run: cargo check --all-targets
      - name: Cargo fmt
        working-directory: src/paint_core
        run: cargo fmt --all -- --check
      - name: Cargo clippy
        working-directory: src/paint_core
        run: cargo clippy --all-targets -- -D warnings
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
      - name: Install Zig 0.15
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v1
        with:
          version: 0.15.1
      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src/paint_core
      - name: Build libpt (Zig static library)
        run: |
          cd src/interface/ffi
          zig build
      - name: Run tests
        working-directory: src/paint_core
        run: cargo test --all-targets
      - name: Write summary
        if: always()
        run: |
          echo "## Rust CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **cargo check**: passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **cargo test**: completed" >> "$GITHUB_STEP_SUMMARY"
